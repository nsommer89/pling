# plingd behind a reverse proxy (e.g. Caddy) on the external Docker network
# "proxy". No host ports: the proxy reaches the container as plingd:8080.
#
#   mkdir -p config && cp users.example.yaml config/users.yaml
#   docker network create proxy   # once, if your proxy has not made it
#   printf 'PLING_HOST=pling.example.com\nPLING_VERSION=%s\n' "$(git describe --tags --always)" > .env
#   docker compose up -d --build
#
# Compose reads .env in this directory for every command (up, logs, down).
#
# The users file is mounted as a directory, not a single file: editors
# replace files when saving, and a single-file bind mount would keep
# showing the old version to the container. The container runs as a
# non-root user, so the file must be world-readable (chmod 644; public
# keys are not secret).
name: pling

services:
  plingd:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${PLING_VERSION:-unknown} # shown to clients after login
    image: plingd:local
    restart: unless-stopped
    environment:
      PLING_HOST: ${PLING_HOST:?set PLING_HOST to the public host name, e.g. pling.example.com}
      PLING_MOTD: ${PLING_MOTD:-}
      PLING_USERS: /config/users.yaml
      PLING_LISTEN: ":8080"
    volumes:
      - ./config:/config:ro
    networks:
      - proxy
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
